<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semester SGPA Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Semester SGPA Calculator 📊</h1>

        <div class="semester-selection">
            <p>Select your current target semester:</p>
            <button data-semester="2">Sem 2</button>
            <button data-semester="3">Sem 3</button>
            <button data-semester="4">Sem 4</button>
            <button data-semester="5">Sem 5</button>
            <button data-semester="6">Sem 6</button>
            <button data-semester="7">Sem 7</button>
            <button data-semester="8">Sem 8</button>
        </div>
        
        <div id="dynamic-form" class="form-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
